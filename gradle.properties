# Project-wide Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build features.
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX.
android.useAndroidX=true

# AGP 9 enables built-in Kotlin and the new DSL by default. This project keeps
# the external org.jetbrains.kotlin.android + kotlin-serialization plugins and the
# classic Android DSL, so opt out of both (opt-out is supported through AGP 9.x).
android.builtInKotlin=false
android.newDsl=false

# Kotlin code style.
kotlin.code.style=official

# Only build the resources for the configured density/language (non-transitive R
# classes keep module R fields scoped and builds fast).
android.nonTransitiveRClass=true
