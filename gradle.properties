# Project-wide Gradle settings.
# See https://docs.gradle.org/current/userguide/build_environment.html

# JVM args for the Gradle daemon.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Build features.
org.gradle.caching=true
org.gradle.configuration-cache=true

# AndroidX.
android.useAndroidX=true

# Kotlin code style.
kotlin.code.style=official

# Only build the resources for the configured density/language (non-transitive R
# classes keep module R fields scoped and builds fast).
android.nonTransitiveRClass=true
