name: Regenerate Gradle verification metadata

# Gradle checks every downloaded dependency against gradle/verification-metadata.xml,
# so a dependency bump (including Dependabot's) fails CI until that file is updated.
# Run this on the bump's branch, then commit the regenerated file it produces (the
# "verification" artifact, also printed base64-encoded in the job log for sandboxes
# that can't download artifacts).

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true
      - name: Write verification metadata
        run: ./gradlew --write-verification-metadata sha256 assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: gradle/verification-metadata.xml
      - name: Print the file to the log
        run: |
          gzip -c gradle/verification-metadata.xml > v.gz
          sha256sum v.gz
          echo BEGIN_B64; base64 -w0 v.gz; echo; echo END_B64
