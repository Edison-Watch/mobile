name: Bootstrap Gradle verification (temporary)

on:
  push:
    branches: [claude/festive-cori-e6o9o8]

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4
        with:
          cache-disabled: true
      - name: Wrapper checksum
        run: |
          SUM=$(curl -sSfL https://services.gradle.org/distributions/gradle-9.5.0-bin.zip.sha256)
          echo "distributionSha256Sum=$SUM" >> gradle/wrapper/gradle-wrapper.properties
      - name: Write verification metadata
        run: ./gradlew --write-verification-metadata sha256 assembleDebug testDebugUnitTest lintDebug --stacktrace
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verification
          path: |
            gradle/wrapper/gradle-wrapper.properties
            gradle/verification-metadata.xml
