name: Pinned refs

# Fail the build if a Dockerfile or workflow uses a mutable reference: images
# must be pinned by digest and actions by commit sha (see
# tools/check_immutable_refs.py).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Images and actions are pinned
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check immutable refs
        run: python3 tools/check_immutable_refs.py
