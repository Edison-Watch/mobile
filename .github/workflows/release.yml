name: Release APK

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.ref_name }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # versionName/versionCode in app/build.gradle.kts are the source of
      # truth; bump them (versionCode must increase) before tagging.
      - name: Check tag matches versionName
        run: |
          version=$(sed -n 's/^ *versionName = "\(.*\)"/\1/p' app/build.gradle.kts)
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match versionName $version in app/build.gradle.kts"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      # Optional: a stable debug keystore lets users upgrade in place between
      # releases. Without it each run signs with a fresh key, so installing a
      # newer release over an older one requires uninstalling first.
      # The keystore must use the standard debug credentials AGP expects:
      # store/key password "android", key alias "androiddebugkey".
      - name: Install stable debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      # Debug build: the only variant CI can sign without release keys that
      # still includes computer use (release/Play builds strip it).
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="sealgate-mobile-tunnel-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          # A release created from the GitHub UI already exists: attach to it.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$apk"
          else
            gh release create "$TAG" "$apk" \
              --title "Mobile Tunnel $TAG" \
              --notes-file .github/release-notes.md \
              --generate-notes
          fi
