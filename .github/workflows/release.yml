name: Release APK

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to release (created on the current commit if missing)
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Optional: a stable debug keystore lets users upgrade in place between
      # releases. Without it each run signs with a fresh key, so installing a
      # newer release over an older one requires uninstalling first.
      - name: Install stable debug keystore
        if: env.DEBUG_KEYSTORE_BASE64 != ''
        run: |
          mkdir -p ~/.android
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > ~/.android/debug.keystore

      # Debug build: the only variant CI can sign without release keys that
      # still includes computer use (release/Play builds strip it).
      - name: Assemble debug
        run: ./gradlew assembleDebug --stacktrace

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="sealgate-mobile-tunnel-${TAG}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          gh release create "$TAG" "$apk" \
            --target "$GITHUB_SHA" \
            --title "Mobile Tunnel $TAG" \
            --notes-file .github/release-notes.md \
            --generate-notes
