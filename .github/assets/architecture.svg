    <text x="104" y="560" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#C3FFFD">&gt;_</text>
  </g>
  <g>
    <rect x="155" y="528" width="52" height="42" rx="2" fill="#070909" stroke="#3A4040" stroke-width="1"/>
    <circle cx="163" cy="537" r="2" fill="#FF3B4D"/><circle cx="171" cy="537" r="2" fill="#9BA4A6"/><circle cx="179" cy="537" r="2" fill="#00C781"/>
    <text x="163" y="560" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#C3FFFD">&gt;_</text>
  </g>
  <g>
    <rect x="214" y="528" width="52" height="42" rx="2" fill="#070909" stroke="#3A4040" stroke-width="1"/>
    <circle cx="222" cy="537" r="2" fill="#FF3B4D"/><circle cx="230" cy="537" r="2" fill="#9BA4A6"/><circle cx="238" cy="537" r="2" fill="#00C781"/>
    <text x="222" y="560" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="700" fill="#C3FFFD">&gt;_</text>
  </g>

  <!-- phone <-> stdio bridge (bidirectional stdin/stdout), secondary grey -->
  <line x1="181" y1="456" x2="181" y2="480" stroke="#9BA4A6" stroke-width="2"/>
  <polygon points="181,448 176,458 186,458" fill="#9BA4A6"/>
  <polygon points="181,488 176,478 186,478" fill="#9BA4A6"/>

  <!-- ============================================================= -->
  <!-- OUTBOUND wss (primary flow, cyan) + BLOCKED inbound (infra red) -->
  <!-- ============================================================= -->
  <line x1="266" y1="258" x2="522" y2="258" stroke="#C3FFFD" stroke-width="3"/>
  <polygon points="538,258 520,250 520,266" fill="#C3FFFD"/>
  <text x="394" y="246" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" font-weight="700" letter-spacing="2" fill="#C3FFFD">wss</text>

  <!-- blocked: inbound can't happen — dashed arrow stopped by a no-entry sign -->
  <line x1="522" y1="304" x2="332" y2="304" stroke="#5E6575" stroke-width="1.6" stroke-dasharray="5 5"/>
  <polygon points="324,304 338,298 338,310" fill="#5E6575"/>
  <g>
    <circle cx="302" cy="304" r="12" fill="#000000" stroke="#FF3B4D" stroke-width="2.4"/>
    <line x1="293.5" y1="295.5" x2="310.5" y2="312.5" stroke="#FF3B4D" stroke-width="2.4"/>
  </g>
  <text x="420" y="326" text-anchor="middle" font-size="11" fill="#9BA4A6">no inbound port</text>

  <!-- ============================================================= -->
  <!-- MIDDLE: GATEWAY = the SealGate mark (Hackbox)                  -->
  <!-- wireframe square + solid tag flush top-left, 40% x 10%         -->
  <!-- ============================================================= -->
  <rect x="540" y="198" width="120" height="120" fill="none" stroke="#C3FFFD" stroke-width="2"/>
  <rect x="542" y="200" width="48" height="12" fill="#C3FFFD"/>
  <rect x="598" y="257" width="3" height="3" fill="#C3FFFD" opacity="0.6"/>
  <text x="600" y="348" text-anchor="middle" font-size="19" font-weight="700" fill="#F9F9F9">Gateway</text>
  <text x="600" y="368" text-anchor="middle" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" letter-spacing="2.5" fill="#C3FFFD">SEALGATE&#160;&#183;&#160;HOSTED</text>

  <!-- gateway <-> cloud agents (two-way agent traffic), secondary grey -->
  <line x1="672" y1="258" x2="848" y2="258" stroke="#9BA4A6" stroke-width="2"/>
  <polygon points="660,258 672,252 672,264" fill="#9BA4A6"/>
  <polygon points="860,258 848,252 848,264" fill="#9BA4A6"/>

  <!-- ============================================================= -->
  <!-- RIGHT: CLOUD AGENTS — logos are the picture                    -->
  <!-- ============================================================= -->
  <rect x="862" y="196" width="258" height="126" fill="none" stroke="#9BA4A6" stroke-width="1.2"/>
  <use href="#logo-chatgpt" x="892" y="224" width="40" height="40" color="#F9F9F9"/>
  <use href="#logo-claude" x="946" y="224" width="40" height="40" color="#D97757"/>
  <use href="#logo-devin" x="1000" y="224" width="40" height="40"/>
  <text x="892" y="300" font-size="19" font-weight="700" fill="#F9F9F9">Cloud agents</text>

  <!-- ===== bottom: lock badge instead of a caption sentence ===== -->
  <use href="#lock" x="470" y="560" width="26" height="26"/>
  <text x="506" y="578" font-size="13" fill="#9BA4A6">Data &amp; logins <tspan fill="#F9F9F9" font-weight="600">stay on the device</tspan></text>
</svg>
