    <!-- lock (data stays on device) -->
    <symbol id="lock" viewBox="0 0 24 24">
      <path d="M7 10V7a5 5 0 0 1 10 0v3" fill="none" stroke="#C3FFFD" stroke-width="2"/>
      <rect x="4.5" y="10" width="15" height="11" fill="#000000" stroke="#C3FFFD" stroke-width="2"/>
      <circle cx="12" cy="15" r="1.7" fill="#C3FFFD"/>
      <rect x="11.2" y="15.5" width="1.6" height="3.6" fill="#C3FFFD"/>
    </symbol>
  </defs>

  <!-- ===== background: baseline black + blueprint grid ===== -->
  <rect x="0" y="0" width="1200" height="620" fill="#000000"/>
  <rect x="0" y="0" width="1200" height="620" fill="url(#grid)"/>
  <!-- sparse cyan grid markers -->
  <g fill="#C3FFFD" opacity="0.5">
    <rect x="475" y="169" width="3" height="1"/><rect x="476" y="168" width="1" height="3"/>
    <rect x="781" y="475" width="3" height="1"/><rect x="782" y="474" width="1" height="3"/>
    <rect x="169" y="475" width="3" height="1"/><rect x="170" y="474" width="1" height="3"/>
    <rect x="985" y="135" width="3" height="1"/><rect x="986" y="134" width="1" height="3"/>
  </g>

  <!-- ===== header ===== -->
  <rect x="60" y="40" width="26" height="9" fill="#C3FFFD"/>
  <text x="94" y="49" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="12" letter-spacing="3" fill="#C3FFFD">STDIO&#160;TUNNEL</text>
  <text x="60" y="80" font-size="23" font-weight="700" fill="#F9F9F9">The phone dials out &#8212; nothing dials in</text>

  <!-- ============================================================= -->
  <!-- LEFT: PHONE (device mockup) — Mobile-Stdiod app               -->
  <!-- ============================================================= -->
  <rect x="93" y="182" width="3" height="24" fill="#2A2E2E"/>
  <rect x="93" y="228" width="3" height="42" fill="#2A2E2E"/>
  <rect x="266" y="214" width="3" height="52" fill="#2A2E2E"/>
  <rect x="96" y="100" width="170" height="356" rx="28" fill="#0A0C0C" stroke="#C3FFFD" stroke-width="1.5"/>
  <rect x="104" y="108" width="154" height="340" rx="22" fill="#000000" stroke="#141A1A" stroke-width="1"/>
  <rect x="158" y="118" width="46" height="13" rx="6.5" fill="#000000" stroke="#141A1A" stroke-width="1"/>
  <circle cx="196" cy="124.5" r="2.6" fill="#0A1414"/>
  <text x="120" y="127" font-family="JetBrains Mono, ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="700" fill="#F9F9F9">9:41</text>
  <rect x="228" y="120" width="16" height="8" rx="2" fill="none" stroke="#9BA4A6" stroke-width="1"/>
  <rect x="230" y="122" width="10" height="4" fill="#9BA4A6"/>

  <!-- app UI -->
  <text x="120" y="188" font-size="15" font-weight="700" fill="#F9F9F9">Mobile-Stdiod</text>
  <circle cx="124" cy="209" r="3.4" fill="#00C781"/>
  <text x="134" y="213" font-size="10.5" fill="#9BA4A6">tunnel active</text>

  <!-- dialing-out signal bars -->
  <rect x="120" y="252" width="6" height="8" fill="#C3FFFD"/>
  <rect x="130" y="246" width="6" height="14" fill="#C3FFFD"/>
  <rect x="140" y="240" width="6" height="20" fill="#2A3030"/>

  <!-- Start / Stop control (active) — square-ish button, small radius -->
  <rect x="120" y="288" width="122" height="42" rx="4" fill="#C3FFFD"/>
  <text x="181" y="314" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1" fill="#00201E">STOP TUNNEL</text>

  <!-- home indicator -->
  <rect x="156" y="432" width="50" height="4" rx="2" fill="#2A3030"/>

  <!-- ============================================================= -->
  <!-- LOCAL stdio MCP servers (on device) — terminal-window glyphs   -->
  <!-- ============================================================= -->
  <rect x="80" y="486" width="202" height="102" fill="none" stroke="#9BA4A6" stroke-width="1.2"/>
  <text x="96" y="514" font-size="14" font-weight="600" fill="#F9F9F9">Local MCP servers</text>
