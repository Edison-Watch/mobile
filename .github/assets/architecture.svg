<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 620" width="1200" height="620" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" role="img" aria-label="Mobile-Stdiod architecture: the phone runs a daemon that dials out over one wss WebSocket to the SealGate gateway, so cloud agents reach the phone's local stdio MCP servers while nothing dials in.">
  <title>Mobile-Stdiod architecture</title>

  <!-- ===== SealGate palette (per sealgate-brand) =====
       Baseline Black #000000 | Core Cyan #C3FFFD | Graphene Grey #9BA4A6
       Wavelength White #F9F9F9 | Circuit Green #00C781 | Infra Red #FF3B4D
       No gradients, no glows, no soft shadows. Square corners on containers. -->

